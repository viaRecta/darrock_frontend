<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Darrock Tracking{% endblock %}</title>
  <style>
    :root {
      --bg: #0f1116; --surface: #181b22; --border: #262a35;
      --muted: #9aa; --text: #e6e6e6; --accent: #9bd;
      --pos: #6cd97e; --neg: #ef6f6f; --warn-bg: #3a2b1a;
      --warn-fg: #fbd28a; --warn-border: #6b4a1f;
    }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif;
           margin: 0; background: var(--bg); color: var(--text); }
    header { padding: 14px 24px; background: var(--surface);
             border-bottom: 1px solid var(--border); }
    header a { color: var(--accent); text-decoration: none; font-weight: 600; }
    main { padding: 24px; max-width: 1400px; margin: 0 auto; }
    h1, h2, h3 { margin: 0 0 12px; }
    h2 { font-size: 16px; color: var(--muted); font-weight: 500;
         text-transform: uppercase; letter-spacing: .06em; }
    a.row-link { color: var(--accent); text-decoration: none; }
    a.row-link:hover { text-decoration: underline; }

    /* tables (generic) */
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
    th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--border); }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--muted); font-weight: 600;
         position: sticky; top: 0; background: var(--surface); z-index: 1; }
    tbody tr:hover { background: rgba(155, 187, 221, 0.04); }

    /* cards */
    .card { background: var(--surface); border: 1px solid var(--border);
            border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .label { color: var(--muted); font-size: 11px; text-transform: uppercase;
             letter-spacing: .06em; }
    .value { font-size: 22px; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .pos { color: var(--pos); } .neg { color: var(--neg); }

    /* scorecard */
    .summary-grid { display: grid;
                    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
                    gap: 10px; margin-bottom: 16px; }
    .summary-grid .card { margin: 0; padding: 12px; }
    .summary-grid .value { font-size: 18px; }

    .meta-row { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
    .meta-row b { color: var(--text); }

    .risk-strip { display: flex; flex-wrap: wrap; gap: 20px 30px;
                  padding: 12px 16px; background: var(--surface);
                  border: 1px solid var(--border); border-radius: 8px;
                  margin: 12px 0 16px; font-size: 13px; }
    .risk-strip .item { display: flex; flex-direction: column; gap: 2px; }
    .risk-strip .lbl { color: var(--muted); font-size: 10px;
                       text-transform: uppercase; letter-spacing: .08em; }
    .risk-strip .num { font-variant-numeric: tabular-nums; font-weight: 500; }

    /* main chart */
    .chart-card { padding: 12px 16px; }
    .chart-controls { display: flex; gap: 8px; margin-bottom: 8px;
                      font-size: 12px; color: var(--muted); }
    .chart-controls button {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px;
    }
    .chart-controls button.active {
      background: var(--accent); color: var(--bg); border-color: var(--accent); }

    /* tabs */
    .tabs { display: flex; gap: 2px; margin-top: 18px;
            border-bottom: 1px solid var(--border); }
    .tabs button { background: transparent; border: 0; color: var(--muted);
                   padding: 10px 16px; cursor: pointer; font-size: 13px;
                   border-bottom: 2px solid transparent;
                   font-family: inherit; }
    .tabs button:hover { color: var(--text); }
    .tabs button.active { color: var(--text);
                          border-bottom-color: var(--accent); }
    .tab-panel { display: none; padding-top: 16px; }
    .tab-panel.active { display: block; }
    .tab-loading { color: var(--muted); padding: 20px; text-align: center; }

    /* sparkline */
    .spark { display: inline-block; vertical-align: middle; }

    /* sortable headers */
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { color: var(--text); }
    th.sortable::after {
      content: " \25B4\25BE";    /* ▴▾ — small up + down triangles */
      opacity: 0.45; font-size: 11px; margin-left: 4px;
      letter-spacing: -2px;
    }
    th.sort-asc::after  {
      content: " \25B2"; opacity: 1; color: var(--accent);
      letter-spacing: normal;
    }
    th.sort-desc::after {
      content: " \25BC"; opacity: 1; color: var(--accent);
      letter-spacing: normal;
    }

    /* misc */
    .warn { background: var(--warn-bg); border: 1px solid var(--warn-border);
            padding: 10px 14px; border-radius: 6px; color: var(--warn-fg);
            margin-bottom: 12px; font-size: 13px; }
    .tabular { font-variant-numeric: tabular-nums; }

    /* header user section */
    header { display: flex; justify-content: space-between; align-items: center; }
    .header-user { display: flex; align-items: center; gap: 16px; font-size: 13px; }
    .header-user .username { color: var(--muted); }
    #logout-btn {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;
      transition: all 0.2s;
    }
    #logout-btn:hover { color: var(--text); border-color: var(--accent); }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <a href="/">Darrock Tracking</a>
    {% if user %}
    <div class="header-user">
      <span class="username">{{ user.username }}</span>
      <button id="logout-btn">logout</button>
    </div>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>

  <script>
    const logoutBtn = document.getElementById('logout-btn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', async () => {
        await fetch('/logout', { method: 'POST' });
        window.location.href = '/login';
      });
    }
  </script>
</body>
</html>
