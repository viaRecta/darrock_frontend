<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Darrock Tracking{% endblock %}</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif;
           margin: 0; background: #0f1116; color: #e6e6e6; }
    header { padding: 14px 24px; background: #181b22; border-bottom: 1px solid #262a35; }
    header a { color: #9bd; text-decoration: none; font-weight: 600; }
    main { padding: 24px; max-width: 1200px; margin: 0 auto; }
    h1, h2 { margin: 0 0 12px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
    th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid #262a35; }
    th:first-child, td:first-child { text-align: left; }
    th { color: #9aa; font-weight: 600; }
    .card { background: #181b22; border: 1px solid #262a35;
            border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr));
                    gap: 12px; }
    .summary-grid .card { margin: 0; }
    .label { color: #9aa; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .value { font-size: 22px; margin-top: 4px; }
    .pos { color: #6cd97e; } .neg { color: #ef6f6f; }
    a.row-link { color: #9bd; text-decoration: none; }
    a.row-link:hover { text-decoration: underline; }
    .warn { background: #3a2b1a; border: 1px solid #6b4a1f;
            padding: 10px 14px; border-radius: 6px; color: #fbd28a; margin-bottom: 12px; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header><a href="/">Darrock Tracking (v3)</a></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
