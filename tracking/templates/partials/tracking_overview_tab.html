<div id="overview" class="tab-content active">
    <div class="chart-container panel--performance performance-panel">
        <h2>Portfolio Performance vs S&amp;P 500</h2>
        <div class="performance-layout">
            <div id="performanceSummary" class="performance-summary"></div>
            <div class="performance-visual">
                <div id="performanceLegend" class="performance-legend"></div>
                <div class="chart-wrapper performance-chart-wrapper">
                    <canvas id="performanceChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div class="chart-container panel--allocation composition-panel">
        <h2>Portfolio Composition</h2>
        <div class="composition-layout">
            <div class="composition-visual">
                <div class="chart-wrapper composition-chart-wrapper">
                    <canvas id="compositionChart"></canvas>
                </div>
            </div>
            <div class="composition-sidebar">
                <div id="compositionLegend" class="composition-legend"></div>
            </div>
        </div>
    </div>

    <div class="chart-container panel--returns returns-panel">
        <h2>Monthly Return Comparison (Portfolio vs S&amp;P 500)</h2>
        <div class="returns-visual">
            <div class="returns-meta">
                <div class="returns-meta-item">
                    <span class="returns-meta-swatch returns-meta-swatch--portfolio"></span>
                    <span class="returns-meta-copy">
                        <span class="returns-meta-title">Portfolio</span>
                        <span class="returns-meta-caption">Monthly return bars</span>
                    </span>
                </div>
                <div class="returns-meta-item">
                    <span class="returns-meta-swatch returns-meta-swatch--benchmark"></span>
                    <span class="returns-meta-copy">
                        <span class="returns-meta-title">S&amp;P 500</span>
                        <span class="returns-meta-caption">Benchmark monthly bars</span>
                    </span>
                </div>
            </div>
            <div class="chart-wrapper returns-chart-wrapper">
                <canvas id="monthlyReturnChart"></canvas>
            </div>
        </div>
    </div>

    <div class="chart-container panel--drawdown drawdown-panel">
        <h2>Monthly Drawdown Comparison</h2>
        <div class="drawdown-visual">
            <div class="drawdown-meta">
                <div class="drawdown-meta-item">
                    <span class="drawdown-meta-swatch drawdown-meta-swatch--portfolio"></span>
                    <span class="drawdown-meta-copy">
                        <span class="drawdown-meta-title">Portfolio</span>
                        <span class="drawdown-meta-caption">Monthly drawdown line</span>
                    </span>
                </div>
                <div class="drawdown-meta-item">
                    <span class="drawdown-meta-swatch drawdown-meta-swatch--benchmark"></span>
                    <span class="drawdown-meta-copy">
                        <span class="drawdown-meta-title">S&amp;P 500</span>
                        <span class="drawdown-meta-caption">Benchmark drawdown line</span>
                    </span>
                </div>
            </div>
            <div class="chart-wrapper drawdown-chart-wrapper">
                <canvas id="monthlyDrawdownChart"></canvas>
            </div>
        </div>
    </div>
</div>
