<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Darrock Research</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-box">
      <h1>darrock</h1>
      <p class="subtitle">quantitative research</p>

      <form action="/v2/dashboard" method="get">
        <div class="form-group">
          <label for="username">username</label>
          <input type="text" id="username" name="username" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">password</label>
          <input type="password" id="password" name="password" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary">enter</button>
      </form>

      <p class="text-muted text-small mt-2" style="font-family: var(--font-ui); font-size: 0.7rem;">
        Authentication is handled by your server.
        This page redirects to the dashboard.
      </p>
    </div>
  </div>
</body>
</html>
