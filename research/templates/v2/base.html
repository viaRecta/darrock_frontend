<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Darrock Research{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/main.css">
  {% block head %}{% endblock %}
</head>
<body>
  {% block nav %}
  <nav class="topnav">
    <a href="/v2/dashboard" class="topnav-brand">darrock</a>
    <div class="topnav-links">
      <a href="/v2/dashboard" class="{{ 'active' if active_page == 'dashboard' }}">dashboard</a>
      <a href="/v2/performance" class="{{ 'active' if active_page == 'performance' }}">performance</a>
    </div>
  </nav>
  {% endblock %}

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
