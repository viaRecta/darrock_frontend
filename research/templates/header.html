<div class="page-header">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-6">
                <h1 class="h3 mb-2">
                    <a href="/" style="color: white; text-decoration: none;">
                        🧇 Super Duper Waffle
                    </a>
                </h1>
                <p class="mb-0 small opacity-75">
                    {% if page_subtitle %}
                        {{ page_subtitle }}
                    {% else %}
                        AI-Driven Investment Strategy
                    {% endif %}
                </p>
            </div>
            <div class="col-md-6 text-end">
                <nav class="d-flex gap-2 justify-content-end flex-wrap">
                    {% if show_back_button %}
                    <button onclick="history.back()" class="btn btn-sm btn-light">
                        <i class="fas fa-arrow-left"></i> Back
                    </button>
                    {% endif %}
                    <a href="/" class="btn btn-sm btn-light {% if active_page == 'home' %}active{% endif %}">
                        <i class="fas fa-home"></i> Home
                    </a>
                    <a href="/dashboard" class="btn btn-sm btn-light {% if active_page == 'dashboard' %}active{% endif %}">
                        <i class="fas fa-chart-line"></i> Dashboard
                    </a>
                    <a href="/performance" class="btn btn-sm btn-light {% if active_page == 'performance' %}active{% endif %}">
                        <i class="fas fa-trophy"></i> Performance
                    </a>
                </nav>
            </div>
        </div>
    </div>
</div>
