<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Darrock Research</title>
  <link rel="stylesheet" href="/static/css/v3.css">
</head>
<body class="login-page">
  <div class="login-wrap">
    <div class="login-box">
      <h1>darrock</h1>
      <p class="sub">quantitative research</p>

      <div id="login-error" class="hidden" style="font-family:var(--font-ui);font-size:var(--fs-xs);color:var(--negative);margin-bottom:1rem;"></div>

      <div class="f-group" style="text-align:left;">
        <label>username</label>
        <input type="text" id="login-user" autocomplete="username">
      </div>
      <div class="f-group" style="text-align:left;margin-top:0.5rem;">
        <label>password</label>
        <input type="password" id="login-pass" autocomplete="current-password">
      </div>
      <button id="login-btn" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:1rem;">enter</button>
    </div>
  </div>

  <script>
    const btn = document.getElementById('login-btn');
    const userEl = document.getElementById('login-user');
    const passEl = document.getElementById('login-pass');
    const errEl = document.getElementById('login-error');

    async function doLogin() {
      errEl.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'signing in...';

      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: userEl.value, password: passEl.value }),
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = '/research';
        } else {
          errEl.textContent = data.message || 'Invalid credentials';
          errEl.classList.remove('hidden');
        }
      } catch (e) {
        errEl.textContent = 'Connection error';
        errEl.classList.remove('hidden');
      }
      btn.disabled = false;
      btn.textContent = 'enter';
    }

    btn.addEventListener('click', doLogin);
    passEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
    userEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') passEl.focus(); });
  </script>
</body>
</html>
